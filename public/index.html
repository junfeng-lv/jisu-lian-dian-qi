<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>手机自动连点器</title>
<style>
  :root { color-scheme: dark; --bg: #0b1020; --line: #22304f; --muted: #7f88a3; --text: #eef2ff; --accent: #55d7a8; --warn: #fbbf24; --danger: #fb7185; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: radial-gradient(1200px 600px at 50% -10%, #172544, transparent 60%), var(--bg); color: var(--text); min-height: 100dvh; }
  .wrap { width: min(480px, 100%); margin: 0 auto; padding: 24px 18px 40px; display: grid; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 22px; margin: 0; }
  .badge { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; }
  .card { background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,.01)); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 20px 40px rgba(0,0,0,.25); }
  .status { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { background: #0d1529; border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .stat .k { color: var(--muted); font-size: 12px; }
  .stat .v { font-size: 20px; font-weight: 750; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .accent { color: var(--accent); }
  label { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
  input, select, button { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #0d1529; color: var(--text); padding: 12px 14px; font-size: 15px; outline: none; }
  input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(85,215,168,.12); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .controls { display: grid; gap: 10px; }
  .btn { cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; }
  .start { background: var(--accent); color: #071513; border-color: var(--accent); }
  .stop { background: #231522; color: var(--danger); }
  .refresh { background: #172544; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.55; }
  .preview { height: 160px; border: 1px solid var(--line); border-radius: 18px; background: radial-gradient(circle at 50% 30%, #1b2a4f, #0b1020 70%); position: relative; overflow: hidden; }
  .dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 8px rgba(251,191,36,.15), 0 0 24px rgba(251,191,36,.45); transform: translate(-50%, -50%); transition: left .12s, top .12s; }
  .pulse { animation: pulse .18s ease-out; }
  @keyframes pulse { 0% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.5); } 100% { transform: translate(-50%,-50%) scale(1); } }
  .log { height: 160px; overflow: auto; background: #080d19; border: 1px solid var(--line); border-radius: 16px; padding: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; color: #c9d1e5; }
  footer { color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>手机自动连点器</h1>
    <span class="badge">ADB 控制</span>
  </header>
  <section class="card status">
    <div class="stat"><div class="k">状态</div><div class="v" id="status">准备中</div></div>
    <div class="stat"><div class="k">已点击</div><div class="v accent" id="count">0</div></div>
  </section>
  <section class="card">
    <div class="row">
      <label><span>点击 X</span><input id="x" type="number" inputmode="numeric" value="540" /></label>
      <label><span>点击 Y</span><input id="y" type="number" inputmode="numeric" value="900" /></label>
    </div>
    <div class="preview" id="preview"><div class="dot" id="dot"></div></div>
    <p class="hint">坐标按已连接设备屏幕分辨率填写。例如 1080×2400 屏幕，中心大约是 540,1200。</p>
  </section>
  <section class="card">
    <label><span>设备</span><select id="device"><option value="">先刷新设备</option></select></label>
  </section>
  <section class="card">
    <div class="row">
      <label><span>间隔 ms</span><input id="interval" type="number" inputmode="numeric" value="150" /></label>
      <label><span>次数</span><input id="total" type="number" inputmode="numeric" value="50" /></label>
    </div>
    <div class="controls">
      <button class="btn start" id="start">开始连点</button>
      <button class="btn stop" id="stop">停止</button>
      <button class="btn refresh" id="refresh">刷新设备</button>
    </div>
  </section>
  <section class="card">
    <div class="log" id="log"></div>
  </section>
  <footer>运行说明：先执行 `adb devices`，再启动本页面。</footer>
</div>
<script>
const $ = (id) => document.getElementById(id);
const preview = $('preview');
const dot = $('dot');
function updatePreview() {
  const x = Number($('x').value) || 0;
  const y = Number($('y').value) || 0;
  const rect = preview.getBoundingClientRect();
  const px = Math.min(Math.max(20, x / 3.8), rect.width - 20);
  const py = Math.min(Math.max(20, y / 3.8), rect.height - 20);
  dot.style.left = px + 'px';
  dot.style.top = py + 'px';
}
['x', 'y'].forEach(id => $(id).addEventListener('input', updatePreview));
async function api(url, opts) { const res = await fetch(url, opts); return res.json(); }
async function loadLogs() {
  const s = await api('/status');
  $('status').textContent = s.status === 'running' ? '连点中' : s.status === 'done' ? '已完成' : s.status === 'stopped' ? '已停止' : '准备中';
  $('count').textContent = s.current || 0;
  dot.classList.toggle('pulse', s.status === 'running');
  $('log').innerHTML = (s.logs || []).map(l => `<div>${l}</div>`).join('');
  $('log').scrollTop = $('log').scrollHeight;
}
$('start').addEventListener('click', async () => {
  const config = { serial: $('device').value, x: Number($('x').value), y: Number($('y').value), interval: Number($('interval').value), total: Number($('total').value) };
  const res = await api('/start', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(config) });
  if (!res.ok) alert(res.error);
  await loadLogs();
});
$('stop').addEventListener('click', async () => { await api('/stop', { method: 'POST' }); await loadLogs(); });
$('refresh').addEventListener('click', async () => {
  const data = await api('/devices');
  $('device').innerHTML = data.map(d => `<option value="${d.serial}">${d.serial}</option>`).join('') || '<option value="">未检测到设备</option>';
});
setInterval(loadLogs, 800);
updatePreview();
loadLogs();
</script>
</body>
</html>
